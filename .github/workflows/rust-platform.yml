name: Rust platform

on:
  pull_request:
    paths:
      - "rust/**"
      - "apps/app/src/lib/native-search-client*"
      - "scripts/native-search-cutover-preflight*"
      - ".github/workflows/rust-platform.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "apps/app/src/lib/native-search-client*"
      - "scripts/native-search-cutover-preflight*"
      - ".github/workflows/rust-platform.yml"

permissions:
  contents: read

concurrency:
  group: rust-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Rust vertical slices
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nibleaf_test
          POSTGRES_PASSWORD: nibleaf_test
          POSTGRES_DB: nibleaf_rust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nibleaf_test -d nibleaf_rust_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      NIBLEAF_TEST_DATABASE_URL: postgresql://nibleaf_test:nibleaf_test@127.0.0.1:5432/nibleaf_rust_test
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust with format and lint components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify the reviewed search dependency patch and runtime pins
        working-directory: rust
        run: python3 scripts/check-search-dependencies.py --self-test

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Type-check all targets
        working-directory: rust
        run: cargo check --locked --workspace --all-targets

      - name: Lint with warnings denied
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run unit tests
        working-directory: rust
        run: cargo test --locked --workspace

      - name: Enforce crate boundaries
        working-directory: rust
        run: bash scripts/check-architecture.sh

      - name: Run PostgreSQL migration and HTTP integration test
        working-directory: rust
        run: bash scripts/test-postgres-integration.sh

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      # RUSTSEC-2023-0071 affects an inactive optional rsa package retained in
      # Cargo.lock. It has no resolved Nibleaf target path and no upstream fix.
      # Keep this exception single-purpose; remove it if either fact changes.
      - name: Guard the inactive RSA audit exception
        working-directory: rust
        run: bash scripts/check-inactive-rsa.sh

      - name: Audit dependency advisories
        working-directory: rust
        run: cargo audit --ignore RUSTSEC-2023-0071 --deny warnings

  msrv:
    name: Check the declared Rust 1.88 baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Compile all workspace targets on the production-image compiler
        working-directory: rust
        run: cargo check --locked --workspace --all-targets

  public-client-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @nibleaf/app exec vitest run src/lib/native-search-client.test.ts
      - run: pnpm --filter @nibleaf/app exec tsc --ignoreConfig --noEmit --strict --target es2022 --module esnext --moduleResolution bundler --skipLibCheck --lib es2022,dom,dom.iterable --types node src/lib/native-search-client.ts src/lib/native-search-client.test.ts
      - run: python3 scripts/native-search-cutover-preflight.test.py
