[workspace]
resolver = "3"
# Third-party source is checked by scripts/check-search-dependencies.py.
exclude = ["vendor/tantivy-0.26.2"]
members = [
  "apps/api",
  "apps/worker",
  "crates/core",
  "crates/outbox",
  "crates/projects",
  "crates/membership",
  "crates/identity",
  "crates/email",
  "crates/content",
  "crates/publishing",
  "crates/search",
]
default-members = ["apps/api", "apps/worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
axum = { version = "0.8.8", features = ["json", "macros"] }
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
hmac = "0.12.1"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "net", "time", "io-util"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
tower = { version = "0.5.2", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6.8", features = ["catch-panic", "cors", "limit", "request-id", "trace", "timeout"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "json", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v7", "serde"] }
time = { version = "0.3.44", features = ["serde", "serde-well-known", "formatting", "parsing"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
http = "1.3.1"
sha2 = "0.10.9"
hex = "0.4.3"
subtle = "2.6.1"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
getrandom = "0.3.4"
url = "2.5.8"
lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
object_store = { version = "=0.14.2", default-features = false, features = ["aws"] }
bytes = "1.12"
futures-util = "0.3.31"
fs4 = "0.13.1"
tar = "=0.4.46"
zstd = "=0.13.3"
tantivy = "=0.26.2"
lindera = { version = "=6.2.0", default-features = false, features = ["embed-ipadic", "embed-cc-cedict"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Tantivy 0.26.2 source is unchanged; only lru is moved to its patched release.
# Remove this patch once a compatible official release carries lru >= 0.18.2.
[patch.crates-io]
tantivy = { path = "vendor/tantivy-0.26.2" }
